services:
  postgres:
    image: ${OAP_POSTGRES_IMAGE:?Pin a PostgreSQL 17 image}
    restart: unless-stopped
    environment:
      POSTGRES_DB: oap
      POSTGRES_USER: oap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - metadata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U oap -d oap']
      interval: 2s
      timeout: 3s
      retries: 30
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  platform:
    image: ${OAP_IMAGE:?Pin the OAP image}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://oap:${POSTGRES_PASSWORD:?}@postgres:5432/oap?sslmode=disable
      OAP_AUTH_MODE: owner
      OAP_ADDR: 0.0.0.0:8787
      OAP_LOCAL_HTTP_PUBLISHED_IP: ${OAP_BIND_ADDR:-127.0.0.1}
      OAP_TARGETS_FILE: /app/config/targets.json
      OAP_BACKUP_REPORTS_DIR: /app/backup-reports
    depends_on:
      postgres: {condition: service_healthy}
    ports:
      - '${OAP_BIND_ADDR:-127.0.0.1}:${OAP_HTTP_PORT:-8878}:8787'
    volumes:
      - ./targets.json:/app/config/targets.json:ro
      - ./backup-reports:/app/backup-reports:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8787/healthz]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=16777216']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
volumes:
  metadata:
