services:
  ingress-init:
    profiles: [setup]
    image: ${OAP_IMAGE:?}
    pull_policy: never
    user: '0:0'
    entrypoint: [/bin/sh, -c]
    command: ['chown 0:0 /socket /data /config && chmod 0700 /socket /data /config && chown 10001:10001 /socket /data /config']
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: ['no-new-privileges:true']
    volumes:
      - ingress-admin:/socket
      - ingress-data:/data
      - ingress-config:/config
  ingress:
    image: ${OAP_CADDY_IMAGE:?}
    restart: unless-stopped
    networks: [ingress-edge]
    user: '10001:10001'
    labels: {io.openappplatform.ingress-target: docker-local}
    command: [caddy, run, --resume, --config, /etc/caddy/bootstrap.json]
    ports:
      - '${OAP_INGRESS_BIND_ADDR:?}:${OAP_INGRESS_HTTP_PORT:?}:80'
      - '${OAP_INGRESS_BIND_ADDR:?}:${OAP_INGRESS_HTTPS_PORT:?}:443'
    volumes:
      - ./ingress-bootstrap.json:/etc/caddy/bootstrap.json:ro
      - ingress-admin:/run/oap-ingress
      - ingress-data:/data
      - ingress-config:/config
    healthcheck:
      test: [CMD-SHELL, 'test -S /run/oap-ingress/admin.sock']
      interval: 2s
      timeout: 3s
      retries: 30
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=16777216']
    cap_drop: [ALL]
    # The official Caddy executable has this file capability; excluding it from
    # the bounding set prevents exec even with unprivileged listener sysctls.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ['no-new-privileges:true']
    sysctls: {net.ipv4.ip_unprivileged_port_start: '0'}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  platform:
    depends_on:
      ingress: {condition: service_healthy}
    volumes:
      - ingress-admin:/run/oap-ingress
volumes:
  ingress-admin:
  ingress-data:
  ingress-config:
networks:
  ingress-edge: {}
