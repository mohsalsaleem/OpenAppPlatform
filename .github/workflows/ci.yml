name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: oap_test
          POSTGRES_USER: oap
          POSTGRES_PASSWORD: oap-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://oap:oap-ci-only@localhost:5432/oap_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -timeout 120s ./...
      - run: go vet ./...
      - name: Build cached fixture for Docker adapter
        run: docker build -t oap-hello-api:dev examples/hello-api
      - name: Docker adapter lifecycle
        env:
          OAP_TEST_DOCKER_SOCKET: /var/run/docker.sock
        run: go test -v ./tests/system -run TestLiveDockerLifecycleOffline -count=1 -timeout=3m
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
