<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="title desc">
  <title id="title">OAP architecture</title>
  <desc id="desc">Clients (oap CLI, oap-mcp, remote read-only MCP, REST, retained dashboard) call one Go process containing the HTTP API, action plans, controller, River workers, incident view and operator adapters. PostgreSQL stores state and the durable queue. Docker Engine on a local socket is the primary runtime; the Coolify adapter is retained.</desc>
  <style>
    .bg { fill: #ffffff; }
    .surface { fill: #f6f8fa; stroke: #d0d7de; }
    .card { fill: #ffffff; stroke: #d0d7de; }
    .oap { fill: #ddf4ff; stroke: #0969da; }
    .agent { fill: #fbefff; stroke: #8250df; }
    .owner { fill: #fff8c5; stroke: #9a6700; }
    .app { fill: none; stroke: #0969da; stroke-width: 2; }
    .inst { fill: #dafbe1; stroke: #1a7f37; }
    .db { fill: #ffffff; stroke: #59636e; }
    .planned { fill: #fff8c5; stroke: #9a6700; stroke-dasharray: 6 4; }
    .line { stroke: #59636e; stroke-width: 1.6; fill: none; }
    .line-accent { stroke: #0969da; stroke-width: 1.8; fill: none; }
    .arrow { fill: #59636e; }
    .arrow-accent { fill: #0969da; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .h { font-size: 15px; font-weight: 600; }
    .b { font-size: 13px; }
    .s { font-size: 12px; fill: #59636e; }
    .label { font-size: 12px; font-weight: 600; fill: #0969da; }
    .warn { font-size: 12px; font-weight: 600; fill: #9a6700; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .surface { fill: #161b22; stroke: #30363d; }
      .card { fill: #0d1117; stroke: #30363d; }
      .oap { fill: #0c2d6b; stroke: #4493f8; }
      .agent { fill: #2d1f4d; stroke: #ab7df8; }
      .owner { fill: #3b2e0a; stroke: #d29922; }
      .app { stroke: #4493f8; }
      .inst { fill: #0f2d1a; stroke: #3fb950; }
      .db { fill: #0d1117; stroke: #9198a1; }
      .planned { fill: #3b2e0a; stroke: #d29922; }
      .line { stroke: #9198a1; }
      .line-accent { stroke: #4493f8; }
      .arrow { fill: #9198a1; }
      .arrow-accent { fill: #4493f8; }
      text { fill: #e6edf3; }
      .s { fill: #9198a1; }
      .label { fill: #4493f8; }
      .warn { fill: #d29922; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow-accent" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <style>
    .parked { fill: none; stroke: #8c959f; stroke-dasharray: 5 4; }
    .step { fill: #ffffff; stroke: #d0d7de; }
    .num { font-size: 12px; font-weight: 700; fill: #ffffff; }
    .numdot { fill: #0969da; }
    .axis { stroke: #8c959f; stroke-width: 1.2; }
    .grid { stroke: #d0d7de; stroke-width: 1; stroke-dasharray: 3 4; }
    .dot { fill: #59636e; }
    .dot-hosted { fill: #ffffff; stroke: #59636e; stroke-width: 2; }
    .dot-oap { fill: #0969da; }
    .drain { fill: #fff1e5; stroke: #bc4c00; stroke-dasharray: 5 3; }
    .bad { font-size: 12px; font-weight: 600; fill: #bc4c00; }
    @media (prefers-color-scheme: dark) {
      .parked { stroke: #6e7681; }
      .step { fill: #0d1117; stroke: #30363d; }
      .num { fill: #0d1117; }
      .numdot { fill: #4493f8; }
      .axis { stroke: #6e7681; }
      .grid { stroke: #30363d; }
      .dot { fill: #9198a1; }
      .dot-hosted { fill: #0d1117; stroke: #9198a1; }
      .dot-oap { fill: #4493f8; }
      .drain { fill: #3d1d0a; stroke: #f0883e; }
      .bad { fill: #f0883e; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow-accent" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="600" rx="12"/>
  <rect class="agent" x="30" y="40" width="168" height="58" rx="8"/>
  <text class="h" x="44" y="64">oap CLI</text>
  <text class="s" x="44" y="84">JSON envelopes</text>
  <path class="line" d="M114,98 L114,140" marker-end="url(#a)"/>
  <rect class="agent" x="213" y="40" width="168" height="58" rx="8"/>
  <text class="h" x="227" y="64">oap-mcp</text>
  <text class="s" x="227" y="84">stdio, --operate</text>
  <path class="line" d="M297,98 L297,140" marker-end="url(#a)"/>
  <rect class="agent" x="396" y="40" width="168" height="58" rx="8"/>
  <text class="h" x="410" y="64">Remote MCP</text>
  <text class="s" x="410" y="84">read-only</text>
  <path class="line" d="M480,98 L480,140" marker-end="url(#a)"/>
  <rect class="card" x="579" y="40" width="168" height="58" rx="8"/>
  <text class="h" x="593" y="64">REST API</text>
  <text class="s" x="593" y="84">OpenAPI contract</text>
  <path class="line" d="M663,98 L663,140" marker-end="url(#a)"/>
  <rect class="parked" x="762" y="40" width="168" height="58" rx="8"/>
  <text class="h" x="776" y="64">Dashboard</text>
  <text class="s" x="776" y="84">retained, parked</text>
  <path class="line" d="M846,98 L846,140" marker-end="url(#a)"/>
  <text class="s" x="30" y="28">Clients: agents use the CLI and MCP; scripts use REST; the owner can still use the dashboard</text>
  <rect class="oap" x="30" y="146" width="900" height="270" rx="12"/>
  <text class="h" x="50" y="172">OAP platform</text><text class="s" x="160" y="172">one Go process (cmd/platform) · internal/*</text>
  <rect class="card" x="50" y="186" width="860" height="54" rx="8"/>
  <text class="h" x="64" y="210">HTTP API · httpapi + access</text>
  <text class="s" x="64" y="230">Owner sessions, scoped agent credentials and grants, CSRF/origin checks, rate limits, durable audit</text>
  <rect class="card" x="50" y="254" width="209" height="82" rx="8"/>
  <text class="h" x="64" y="278">Action plans</text>
  <text class="b" x="64" y="298">validate · diff · plan</text>
  <text class="b" x="64" y="316">execute · exact review</text>
  <rect class="card" x="267" y="254" width="209" height="82" rx="8"/>
  <text class="h" x="281" y="278">Controller</text>
  <text class="b" x="281" y="298">frozen releases, claims</text>
  <text class="b" x="281" y="316">dispatch once, recover</text>
  <rect class="card" x="484" y="254" width="209" height="82" rx="8"/>
  <text class="h" x="498" y="278">River workers</text>
  <text class="b" x="498" y="298">durable jobs</text>
  <text class="b" x="498" y="316">survive restarts</text>
  <rect class="card" x="701" y="254" width="209" height="82" rx="8"/>
  <text class="h" x="715" y="278">Incident view</text>
  <text class="b" x="715" y="298">bounded evidence</text>
  <text class="b" x="715" y="316">freshness, redaction</text>
  <rect class="card" x="50" y="350" width="860" height="52" rx="8"/>
  <text class="h" x="64" y="374">Operator adapters · internal/operator</text>
  <text class="s" x="64" y="394">Explicit capabilities per target, safe projections, no silent adoption of existing resources</text>
  <rect class="db" x="30" y="470" width="250" height="92" rx="8"/>
  <text class="h" x="44" y="494">PostgreSQL</text>
  <text class="b" x="44" y="514">State, versions, releases</text>
  <text class="b" x="44" y="532">Audit trail, River queue</text>
  <path class="line" d="M155,416 L155,470" marker-end="url(#a)" marker-start="url(#a)"/>
  <rect class="surface" x="320" y="452" width="390" height="128" rx="12"/>
  <text class="h" x="338" y="478">Docker Engine</text><text class="label" x="458" y="478">PRIMARY · local socket</text>
  <rect class="inst" x="338" y="496" width="108" height="36" rx="6"/>
  <text class="b" x="352" y="519">web ×N</text>
  <rect class="inst" x="458" y="496" width="108" height="36" rx="6"/>
  <text class="b" x="472" y="519">api ×N</text>
  <rect class="inst" x="578" y="496" width="108" height="36" rx="6"/>
  <text class="b" x="592" y="519">worker</text>
  <text class="s" x="338" y="560">One bridge network per app, app-local DNS, named volumes</text>
  <path class="line-accent" d="M515,400 L515,452" marker-end="url(#aa)"/>
  <rect class="parked" x="750" y="470" width="180" height="92" rx="8"/>
  <text class="h" x="764" y="494">Coolify</text>
  <text class="s" x="764" y="514">retained adapter</text>
  <text class="s" x="764" y="532">operator work parked</text>
  <path class="line" d="M840,400 L840,470" marker-end="url(#a)" style="stroke-dasharray:5 4"/>
</svg>
