<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 364" width="1000" height="364" role="img" aria-labelledby="title desc">
  <title id="title">Agent lifecycle loop</title>
  <desc id="desc">Edit spec, validate and diff, plan, optional owner review, execute, wait on the durable operation, verify. On an issue the agent reads incident evidence, corrects the spec or runtime, and plans again.</desc>
  <style>
    .bg { fill: #ffffff; }
    .surface { fill: #f6f8fa; stroke: #d0d7de; }
    .card { fill: #ffffff; stroke: #d0d7de; }
    .oap { fill: #ddf4ff; stroke: #0969da; }
    .agent { fill: #fbefff; stroke: #8250df; }
    .owner { fill: #fff8c5; stroke: #9a6700; }
    .app { fill: none; stroke: #0969da; stroke-width: 2; }
    .inst { fill: #dafbe1; stroke: #1a7f37; }
    .db { fill: #ffffff; stroke: #59636e; }
    .planned { fill: #fff8c5; stroke: #9a6700; stroke-dasharray: 6 4; }
    .line { stroke: #59636e; stroke-width: 1.6; fill: none; }
    .line-accent { stroke: #0969da; stroke-width: 1.8; fill: none; }
    .arrow { fill: #59636e; }
    .arrow-accent { fill: #0969da; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .h { font-size: 15px; font-weight: 600; }
    .b { font-size: 13px; }
    .s { font-size: 12px; fill: #59636e; }
    .label { font-size: 12px; font-weight: 600; fill: #0969da; }
    .warn { font-size: 12px; font-weight: 600; fill: #9a6700; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .surface { fill: #161b22; stroke: #30363d; }
      .card { fill: #0d1117; stroke: #30363d; }
      .oap { fill: #0c2d6b; stroke: #4493f8; }
      .agent { fill: #2d1f4d; stroke: #ab7df8; }
      .owner { fill: #3b2e0a; stroke: #d29922; }
      .app { stroke: #4493f8; }
      .inst { fill: #0f2d1a; stroke: #3fb950; }
      .db { fill: #0d1117; stroke: #9198a1; }
      .planned { fill: #3b2e0a; stroke: #d29922; }
      .line { stroke: #9198a1; }
      .line-accent { stroke: #4493f8; }
      .arrow { fill: #9198a1; }
      .arrow-accent { fill: #4493f8; }
      text { fill: #e6edf3; }
      .s { fill: #9198a1; }
      .label { fill: #4493f8; }
      .warn { fill: #d29922; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow-accent" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <style>
    .parked { fill: none; stroke: #8c959f; stroke-dasharray: 5 4; }
    .step { fill: #ffffff; stroke: #d0d7de; }
    .num { font-size: 12px; font-weight: 700; fill: #ffffff; }
    .numdot { fill: #0969da; }
    .axis { stroke: #8c959f; stroke-width: 1.2; }
    .grid { stroke: #d0d7de; stroke-width: 1; stroke-dasharray: 3 4; }
    .dot { fill: #59636e; }
    .dot-hosted { fill: #ffffff; stroke: #59636e; stroke-width: 2; }
    .dot-oap { fill: #0969da; }
    .drain { fill: #fff1e5; stroke: #bc4c00; stroke-dasharray: 5 3; }
    .bad { font-size: 12px; font-weight: 600; fill: #bc4c00; }
    @media (prefers-color-scheme: dark) {
      .parked { stroke: #6e7681; }
      .step { fill: #0d1117; stroke: #30363d; }
      .num { fill: #0d1117; }
      .numdot { fill: #4493f8; }
      .axis { stroke: #6e7681; }
      .grid { stroke: #30363d; }
      .dot { fill: #9198a1; }
      .dot-hosted { fill: #0d1117; stroke: #9198a1; }
      .dot-oap { fill: #4493f8; }
      .drain { fill: #3d1d0a; stroke: #f0883e; }
      .bad { fill: #f0883e; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow-accent" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1000" height="364" rx="12"/>
  <rect class="agent" x="14" y="70" width="130" height="92" rx="10"/>
  <circle class="numdot" cx="34" cy="92" r="10"/><text class="num" x="30" y="96">1</text>
  <text class="h" x="50" y="97">Edit spec</text>
  <text class="mono" x="26" y="126">oap.dev/v1alpha1</text>
  <text class="s" x="26" y="146">in your repo</text>
  <path class="line" d="M144,116 L155,116" marker-end="url(#a)"/>
  <rect class="card" x="156" y="70" width="130" height="92" rx="10"/>
  <circle class="numdot" cx="176" cy="92" r="10"/><text class="num" x="172" y="96">2</text>
  <text class="h" x="192" y="97">Validate</text>
  <text class="mono" x="168" y="126">validate-spec</text>
  <text class="s" x="168" y="146">+ diff-spec</text>
  <path class="line" d="M286,116 L297,116" marker-end="url(#a)"/>
  <rect class="card" x="298" y="70" width="130" height="92" rx="10"/>
  <circle class="numdot" cx="318" cy="92" r="10"/><text class="num" x="314" y="96">3</text>
  <text class="h" x="334" y="97">Plan</text>
  <text class="mono" x="310" y="126">action-plan</text>
  <text class="s" x="310" y="146">stored and hashed</text>
  <path class="line" d="M428,116 L439,116" marker-end="url(#a)"/>
  <rect class="planned" x="440" y="70" width="130" height="92" rx="10"/>
  <circle class="numdot" cx="460" cy="92" r="10"/><text class="num" x="456" y="96">4</text>
  <text class="h" x="476" y="97">Review</text>
  <text class="mono" x="452" y="126">owner session</text>
  <text class="s" x="452" y="146">only if required</text>
  <path class="line" d="M570,116 L581,116" marker-end="url(#a)"/>
  <rect class="card" x="582" y="70" width="130" height="92" rx="10"/>
  <circle class="numdot" cx="602" cy="92" r="10"/><text class="num" x="598" y="96">5</text>
  <text class="h" x="618" y="97">Execute</text>
  <text class="mono" x="594" y="126">execute-action</text>
  <text class="s" x="594" y="146">202 = admitted</text>
  <path class="line" d="M712,116 L723,116" marker-end="url(#a)"/>
  <rect class="card" x="724" y="70" width="130" height="92" rx="10"/>
  <circle class="numdot" cx="744" cy="92" r="10"/><text class="num" x="740" y="96">6</text>
  <text class="h" x="760" y="97">Wait</text>
  <text class="mono" x="736" y="126">wait</text>
  <text class="s" x="736" y="146">durable operation</text>
  <path class="line" d="M854,116 L865,116" marker-end="url(#a)"/>
  <rect class="card" x="866" y="70" width="130" height="92" rx="10"/>
  <circle class="numdot" cx="886" cy="92" r="10"/><text class="num" x="882" y="96">7</text>
  <text class="h" x="902" y="97">Verify</text>
  <text class="mono" x="878" y="126">verify</text>
  <text class="s" x="878" y="146">health + behaviour</text>
  <text class="s" x="24" y="44">Every step is a structured CLI, MCP or REST call. Saving a spec never deploys; HTTP 202 means admitted, not succeeded.</text>
  <path class="line" d="M931.0,162 L931.0,226" marker-end="url(#a)"/>
  <text class="s" x="923.0" y="200" text-anchor="end">issue or</text><text class="s" x="923.0" y="214" text-anchor="end">inconclusive</text>
  <rect class="drain" x="640" y="230" width="340" height="78" rx="8"/>
  <text class="h" x="654" y="254">Diagnose · oap incident</text>
  <text class="s" x="654" y="274">Runtime health, recent operations, masked release</text>
  <text class="s" x="654" y="292">changes, events, optional redacted log sample</text>
  <path class="line" d="M640,269 L452,269" marker-end="url(#a)"/>
  <rect class="agent" x="150" y="230" width="300" height="78" rx="8"/>
  <text class="h" x="164" y="254">Correct</text>
  <text class="s" x="164" y="274">Edit the spec, roll back an image, restart</text>
  <text class="s" x="164" y="292">an instance or recover an operation</text>
  <path class="line" d="M150,269 L79.0,269 L79.0,166" marker-end="url(#a)"/>
  <text class="s" x="87.0" y="200">new plan</text>
  <text class="s" x="24" y="340">The agent proposes and executes fixes within its grant. It cannot approve its own plans, widen its scope or touch the control database.</text>
</svg>
