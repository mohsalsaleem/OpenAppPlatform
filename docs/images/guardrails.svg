<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 994 432" width="994" height="432" role="img" aria-labelledby="title desc">
  <title id="title">Agent guardrails</title>
  <desc id="desc">An agent request passes five server-side checks: identity, scope, freshness, policy and safety. Passing requests become durable operations recorded in the audit trail; the agent receives bounded, redacted evidence. Some actions are never reachable through an agent credential.</desc>
  <style>
    .bg { fill: #ffffff; }
    .surface { fill: #f6f8fa; stroke: #d0d7de; }
    .card { fill: #ffffff; stroke: #d0d7de; }
    .oap { fill: #ddf4ff; stroke: #0969da; }
    .agent { fill: #fbefff; stroke: #8250df; }
    .owner { fill: #fff8c5; stroke: #9a6700; }
    .app { fill: none; stroke: #0969da; stroke-width: 2; }
    .inst { fill: #dafbe1; stroke: #1a7f37; }
    .db { fill: #ffffff; stroke: #59636e; }
    .planned { fill: #fff8c5; stroke: #9a6700; stroke-dasharray: 6 4; }
    .line { stroke: #59636e; stroke-width: 1.6; fill: none; }
    .line-accent { stroke: #0969da; stroke-width: 1.8; fill: none; }
    .arrow { fill: #59636e; }
    .arrow-accent { fill: #0969da; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .h { font-size: 15px; font-weight: 600; }
    .b { font-size: 13px; }
    .s { font-size: 12px; fill: #59636e; }
    .label { font-size: 12px; font-weight: 600; fill: #0969da; }
    .warn { font-size: 12px; font-weight: 600; fill: #9a6700; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .surface { fill: #161b22; stroke: #30363d; }
      .card { fill: #0d1117; stroke: #30363d; }
      .oap { fill: #0c2d6b; stroke: #4493f8; }
      .agent { fill: #2d1f4d; stroke: #ab7df8; }
      .owner { fill: #3b2e0a; stroke: #d29922; }
      .app { stroke: #4493f8; }
      .inst { fill: #0f2d1a; stroke: #3fb950; }
      .db { fill: #0d1117; stroke: #9198a1; }
      .planned { fill: #3b2e0a; stroke: #d29922; }
      .line { stroke: #9198a1; }
      .line-accent { stroke: #4493f8; }
      .arrow { fill: #9198a1; }
      .arrow-accent { fill: #4493f8; }
      text { fill: #e6edf3; }
      .s { fill: #9198a1; }
      .label { fill: #4493f8; }
      .warn { fill: #d29922; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow-accent" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <style>
    .parked { fill: none; stroke: #8c959f; stroke-dasharray: 5 4; }
    .step { fill: #ffffff; stroke: #d0d7de; }
    .num { font-size: 12px; font-weight: 700; fill: #ffffff; }
    .numdot { fill: #0969da; }
    .axis { stroke: #8c959f; stroke-width: 1.2; }
    .grid { stroke: #d0d7de; stroke-width: 1; stroke-dasharray: 3 4; }
    .dot { fill: #59636e; }
    .dot-hosted { fill: #ffffff; stroke: #59636e; stroke-width: 2; }
    .dot-oap { fill: #0969da; }
    .drain { fill: #fff1e5; stroke: #bc4c00; stroke-dasharray: 5 3; }
    .bad { font-size: 12px; font-weight: 600; fill: #bc4c00; }
    @media (prefers-color-scheme: dark) {
      .parked { stroke: #6e7681; }
      .step { fill: #0d1117; stroke: #30363d; }
      .num { fill: #0d1117; }
      .numdot { fill: #4493f8; }
      .axis { stroke: #6e7681; }
      .grid { stroke: #30363d; }
      .dot { fill: #9198a1; }
      .dot-hosted { fill: #0d1117; stroke: #9198a1; }
      .dot-oap { fill: #4493f8; }
      .drain { fill: #3d1d0a; stroke: #f0883e; }
      .bad { fill: #f0883e; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow-accent" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="994" height="432" rx="12"/>
  <text class="h" x="14" y="32">Guardrails on every agent request</text>
  <text class="s" x="14" y="52">Enforced by the OAP server, not by prompts or skills. Any failed check returns a structured error and nothing is dispatched.</text>
  <rect class="agent" x="14" y="86" width="132" height="96" rx="8"/>
  <text class="h" x="28" y="110">Agent request</text>
  <text class="b" x="28" y="130">plan, execute,</text>
  <text class="b" x="28" y="148">read, wait</text>
  <path class="line" d="M146,134 L163,134" marker-end="url(#a)"/>
  <rect class="oap" x="164" y="86" width="156" height="96" rx="10"/>
  <circle class="numdot" cx="184" cy="108" r="10"/><text class="num" x="180" y="112">1</text>
  <text class="h" x="200" y="113">Identity</text>
  <text class="b" x="178" y="136">credential is live</text>
  <text class="b" x="178" y="154">not paused, revoked</text>
  <text class="b" x="178" y="172">or expired</text>
  <path class="line" d="M320,134 L329,134" marker-end="url(#a)"/>
  <rect class="oap" x="330" y="86" width="156" height="96" rx="10"/>
  <circle class="numdot" cx="350" cy="108" r="10"/><text class="num" x="346" y="112">2</text>
  <text class="h" x="366" y="113">Scope</text>
  <text class="b" x="344" y="136">target + environment</text>
  <text class="b" x="344" y="154">granted apps only</text>
  <text class="b" x="344" y="172">allowed actions</text>
  <path class="line" d="M486,134 L495,134" marker-end="url(#a)"/>
  <rect class="oap" x="496" y="86" width="156" height="96" rx="10"/>
  <circle class="numdot" cx="516" cy="108" r="10"/><text class="num" x="512" y="112">3</text>
  <text class="h" x="532" y="113">Freshness</text>
  <text class="b" x="510" y="136">expected version</text>
  <text class="b" x="510" y="154">stale plans rejected</text>
  <text class="b" x="510" y="172">immutable images</text>
  <path class="line" d="M652,134 L661,134" marker-end="url(#a)"/>
  <rect class="oap" x="662" y="86" width="156" height="96" rx="10"/>
  <circle class="numdot" cx="682" cy="108" r="10"/><text class="num" x="678" y="112">4</text>
  <text class="h" x="698" y="113">Policy</text>
  <text class="b" x="676" y="136">routine: the grant</text>
  <text class="b" x="676" y="154">risky: owner review</text>
  <text class="b" x="676" y="172">exact plan hash</text>
  <path class="line" d="M818,134 L827,134" marker-end="url(#a)"/>
  <rect class="oap" x="828" y="86" width="156" height="96" rx="10"/>
  <circle class="numdot" cx="848" cy="108" r="10"/><text class="num" x="844" y="112">5</text>
  <text class="h" x="864" y="113">Safety</text>
  <text class="b" x="842" y="136">idempotency keys</text>
  <text class="b" x="842" y="154">component claims</text>
  <text class="b" x="842" y="172">dispatch once</text>
  <path class="line-accent" d="M906.0,182 L906.0,214 L346.0,214 L346.0,240" marker-end="url(#aa)"/>
  <path class="line-accent" d="M906.0,214 L906.0,240" marker-end="url(#aa)"/>
  <rect class="inst" x="264" y="244" width="300" height="96" rx="8"/>
  <text class="h" x="278" y="268">Durable operation</text>
  <text class="b" x="278" y="288">Dispatched once, then observed</text>
  <text class="b" x="278" y="306">Uncertain outcome: attention, not retry</text>
  <text class="b" x="278" y="324">Survives client and controller restarts</text>
  <rect class="card" x="704" y="244" width="276" height="96" rx="8"/>
  <text class="h" x="718" y="268">Audit trail</text>
  <text class="b" x="718" y="288">Every mutation and the credential</text>
  <text class="b" x="718" y="306">behind it, visible to the owner</text>
  <text class="b" x="718" y="324">Owner can pause or revoke anytime</text>
  <rect class="card" x="14" y="244" width="236" height="96" rx="8"/>
  <text class="h" x="28" y="268">Evidence back to the agent</text>
  <text class="b" x="28" y="288">Bounded and redacted</text>
  <text class="b" x="28" y="306">Logs marked untrusted</text>
  <text class="b" x="28" y="324">Freshness stated explicitly</text>
  <path class="line" d="M264,292 L251,292" marker-end="url(#a)"/>
  <rect class="parked" x="14" y="360" width="966" height="56" rx="8"/>
  <text class="h" x="28" y="384">Never reachable through an agent credential</text>
  <text class="s" x="28" y="404">Control database · host shell · issuing or widening grants · approving its own plans · adopting existing resources · provisioning databases · privileged containers</text>
</svg>
