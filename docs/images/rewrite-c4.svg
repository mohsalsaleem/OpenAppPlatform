<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 624" width="1000" height="624" role="img" aria-labelledby="title desc">
  <title id="title">Agent-native OAP target architecture</title>
  <desc id="desc">Owner and AI agent outside the server; the agent keeps a synced store without credentials. On the server, the OAP control plane exposes observe, propose, apply, await, explain, ask and login; an intent compiler, policy engine and reconciler sit over a Git repo of YAML desired state, SQLite operational state and an encrypted secret store. OAP drives the Docker runtime: a Caddy edge and one application of web, api, worker, job and data components. GitHub supplies change facts, the registry images, DNS and ACME certificates, and users send HTTPS traffic.</desc>
