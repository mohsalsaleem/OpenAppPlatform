<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 376" width="960" height="376" role="img" aria-labelledby="title desc">
  <title id="title">The scale loop</title>
  <desc id="desc">Change instances from 1 to 3 in the spec and apply. New copies start and join the router only when ready. Scaling down removes copies from the router, drains them and then stops them.</desc>
  <style>
    .bg { fill: #ffffff; }
    .surface { fill: #f6f8fa; stroke: #d0d7de; }
    .card { fill: #ffffff; stroke: #d0d7de; }
    .oap { fill: #ddf4ff; stroke: #0969da; }
    .agent { fill: #fbefff; stroke: #8250df; }
    .owner { fill: #fff8c5; stroke: #9a6700; }
    .app { fill: none; stroke: #0969da; stroke-width: 2; }
    .inst { fill: #dafbe1; stroke: #1a7f37; }
    .db { fill: #ffffff; stroke: #59636e; }
    .planned { fill: #fff8c5; stroke: #9a6700; stroke-dasharray: 6 4; }
    .line { stroke: #59636e; stroke-width: 1.6; fill: none; }
    .line-accent { stroke: #0969da; stroke-width: 1.8; fill: none; }
    .arrow { fill: #59636e; }
    .arrow-accent { fill: #0969da; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .h { font-size: 15px; font-weight: 600; }
    .b { font-size: 13px; }
    .s { font-size: 12px; fill: #59636e; }
    .label { font-size: 12px; font-weight: 600; fill: #0969da; }
    .warn { font-size: 12px; font-weight: 600; fill: #9a6700; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .surface { fill: #161b22; stroke: #30363d; }
      .card { fill: #0d1117; stroke: #30363d; }
      .oap { fill: #0c2d6b; stroke: #4493f8; }
      .agent { fill: #2d1f4d; stroke: #ab7df8; }
      .owner { fill: #3b2e0a; stroke: #d29922; }
      .app { stroke: #4493f8; }
      .inst { fill: #0f2d1a; stroke: #3fb950; }
      .db { fill: #0d1117; stroke: #9198a1; }
      .planned { fill: #3b2e0a; stroke: #d29922; }
      .line { stroke: #9198a1; }
      .line-accent { stroke: #4493f8; }
      .arrow { fill: #9198a1; }
      .arrow-accent { fill: #4493f8; }
      text { fill: #e6edf3; }
      .s { fill: #9198a1; }
      .label { fill: #4493f8; }
      .warn { fill: #d29922; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow-accent" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <style>
    .parked { fill: none; stroke: #8c959f; stroke-dasharray: 5 4; }
    .step { fill: #ffffff; stroke: #d0d7de; }
    .num { font-size: 12px; font-weight: 700; fill: #ffffff; }
    .numdot { fill: #0969da; }
    .axis { stroke: #8c959f; stroke-width: 1.2; }
    .grid { stroke: #d0d7de; stroke-width: 1; stroke-dasharray: 3 4; }
    .dot { fill: #59636e; }
    .dot-hosted { fill: #ffffff; stroke: #59636e; stroke-width: 2; }
    .dot-oap { fill: #0969da; }
    .drain { fill: #fff1e5; stroke: #bc4c00; stroke-dasharray: 5 3; }
    .bad { font-size: 12px; font-weight: 600; fill: #bc4c00; }
    @media (prefers-color-scheme: dark) {
      .parked { stroke: #6e7681; }
      .step { fill: #0d1117; stroke: #30363d; }
      .num { fill: #0d1117; }
      .numdot { fill: #4493f8; }
      .axis { stroke: #6e7681; }
      .grid { stroke: #30363d; }
      .dot { fill: #9198a1; }
      .dot-hosted { fill: #0d1117; stroke: #9198a1; }
      .dot-oap { fill: #4493f8; }
      .drain { fill: #3d1d0a; stroke: #f0883e; }
      .bad { fill: #f0883e; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow-accent" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="376" rx="12"/>
  <text class="h" x="24" y="34">The scale loop</text><text class="warn" x="140" y="34">router and draining planned for M3.1 · instance lifecycle exists today</text>
  <rect class="surface" x="24" y="52" width="276" height="300" rx="12"/>
  <circle class="numdot" cx="48" cy="78" r="11"/><text class="num" x="44" y="82">1</text><text class="h" x="66" y="83">Change one number</text>
  <rect class="card" x="42" y="98" width="240" height="140" rx="8"/>
  <text class="mono" x="56" y="118" style="white-space:pre">{</text>
  <text class="mono" x="56" y="138" style="white-space:pre">  "name": "api",</text>
  <text class="mono" x="56" y="158" style="white-space:pre">  "kind": "web",</text>
  <text class="mono" x="56" y="178" style="white-space:pre">  "route": "/api",</text>
  <text class="mono" x="56" y="198" style="white-space:pre">  "instances": </text><text class="mono" x="170" y="198" style="text-decoration:line-through">1</text><text class="label" x="184" y="198">3</text>
  <text class="mono" x="56" y="218">}</text>
  <text class="mono" x="42" y="270">$ oap plan</text>
  <text class="s" x="42" y="290">api: +2 instances, router: +2 backends</text>
  <text class="mono" x="42" y="318">$ oap apply</text>
  <path class="line" d="M300,200 L330,200" marker-end="url(#a)"/>
  <rect class="surface" x="334" y="52" width="290" height="300" rx="12"/>
  <circle class="numdot" cx="358" cy="78" r="11"/><text class="num" x="354" y="82">2</text><text class="h" x="376" y="83">New copies join when ready</text>
  <rect class="planned" x="352" y="100" width="254" height="40" rx="8"/><text class="h" x="368" y="125">Router  /api</text>
  <rect class="inst" x="352" y="200" width="78" height="56" rx="7"/><text class="h" x="362" y="222">api-1</text><text class="s" x="362" y="242">serving</text>
  <path class="line" d="M391,140 L391,198" marker-end="url(#a)"/>
  <rect class="inst" x="438" y="200" width="78" height="56" rx="7"/><text class="h" x="448" y="222">api-2</text><text class="s" x="448" y="242">ready</text>
  <path class="line" d="M477,140 L477,198" marker-end="url(#a)"/>
  <rect class="step" x="524" y="200" width="78" height="56" rx="7"/><text class="h" x="534" y="222">api-3</text><text class="s" x="534" y="242">starting…</text>
  <path class="line" d="M563,140 L563,198" style="stroke-dasharray:4 4"/>
  <text class="s" x="352" y="284">Each instance gets its own container and</text>
  <text class="s" x="352" y="302">ordinal. It becomes a route member only</text>
  <text class="s" x="352" y="320">after its readiness check passes.</text>
  <path class="line" d="M624,200 L654,200" marker-end="url(#a)"/>
  <rect class="surface" x="658" y="52" width="278" height="300" rx="12"/>
  <circle class="numdot" cx="682" cy="78" r="11"/><text class="num" x="678" y="82">3</text><text class="h" x="700" y="83">Scale down safely</text>
  <rect class="planned" x="676" y="100" width="242" height="40" rx="8"/><text class="h" x="692" y="125">Router  /api</text>
  <rect class="inst" x="676" y="200" width="76" height="56" rx="7"/><text class="h" x="686" y="222">api-1</text><text class="s" x="686" y="242">serving</text>
  <rect class="drain" x="758" y="200" width="76" height="56" rx="7"/><text class="h" x="768" y="222">api-2</text><text class="bad" x="768" y="242">draining</text>
  <rect class="drain" x="840" y="200" width="76" height="56" rx="7"/><text class="h" x="850" y="222">api-3</text><text class="bad" x="850" y="242">draining</text>
  <path class="line" d="M714,140 L714,198" marker-end="url(#a)"/>
  <text class="s" x="676" y="284">3 → 1: removed copies leave the</text>
  <text class="s" x="676" y="302">router first, drain, then stop.</text>
  <text class="s" x="676" y="320">Routes keep serving if OAP is down.</text>
</svg>
