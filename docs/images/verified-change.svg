<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 994 384" width="994" height="384" role="img" aria-labelledby="title desc">
  <title id="title">Verified change flow</title>
  <desc id="desc">A change gets a temporary preview built from production plus that change, where declared checks run. If they pass, a guarded rollout updates one production instance first, checks it, then the rest; a failure rolls back automatically. Long-lived environments with comparison and an urgent-fix fast lane are optional.</desc>
  <style>
    .bg { fill: #ffffff; }
    .surface { fill: #f6f8fa; stroke: #d0d7de; }
    .card { fill: #ffffff; stroke: #d0d7de; }
    .oap { fill: #ddf4ff; stroke: #0969da; }
    .agent { fill: #fbefff; stroke: #8250df; }
    .owner { fill: #fff8c5; stroke: #9a6700; }
    .app { fill: none; stroke: #0969da; stroke-width: 2; }
    .inst { fill: #dafbe1; stroke: #1a7f37; }
    .db { fill: #ffffff; stroke: #59636e; }
    .planned { fill: #fff8c5; stroke: #9a6700; stroke-dasharray: 6 4; }
    .line { stroke: #59636e; stroke-width: 1.6; fill: none; }
    .line-accent { stroke: #0969da; stroke-width: 1.8; fill: none; }
    .arrow { fill: #59636e; }
    .arrow-accent { fill: #0969da; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .h { font-size: 15px; font-weight: 600; }
    .b { font-size: 13px; }
    .s { font-size: 12px; fill: #59636e; }
    .label { font-size: 12px; font-weight: 600; fill: #0969da; }
    .warn { font-size: 12px; font-weight: 600; fill: #9a6700; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .surface { fill: #161b22; stroke: #30363d; }
      .card { fill: #0d1117; stroke: #30363d; }
      .oap { fill: #0c2d6b; stroke: #4493f8; }
      .agent { fill: #2d1f4d; stroke: #ab7df8; }
      .owner { fill: #3b2e0a; stroke: #d29922; }
      .app { stroke: #4493f8; }
      .inst { fill: #0f2d1a; stroke: #3fb950; }
      .db { fill: #0d1117; stroke: #9198a1; }
      .planned { fill: #3b2e0a; stroke: #d29922; }
      .line { stroke: #9198a1; }
      .line-accent { stroke: #4493f8; }
      .arrow { fill: #9198a1; }
      .arrow-accent { fill: #4493f8; }
      text { fill: #e6edf3; }
      .s { fill: #9198a1; }
      .label { fill: #4493f8; }
      .warn { fill: #d29922; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow-accent" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <style>
    .parked { fill: none; stroke: #8c959f; stroke-dasharray: 5 4; }
    .step { fill: #ffffff; stroke: #d0d7de; }
    .num { font-size: 12px; font-weight: 700; fill: #ffffff; }
    .numdot { fill: #0969da; }
    .axis { stroke: #8c959f; stroke-width: 1.2; }
    .grid { stroke: #d0d7de; stroke-width: 1; stroke-dasharray: 3 4; }
    .dot { fill: #59636e; }
    .dot-hosted { fill: #ffffff; stroke: #59636e; stroke-width: 2; }
    .dot-oap { fill: #0969da; }
    .drain { fill: #fff1e5; stroke: #bc4c00; stroke-dasharray: 5 3; }
    .bad { font-size: 12px; font-weight: 600; fill: #bc4c00; }
    @media (prefers-color-scheme: dark) {
      .parked { stroke: #6e7681; }
      .step { fill: #0d1117; stroke: #30363d; }
      .num { fill: #0d1117; }
      .numdot { fill: #4493f8; }
      .axis { stroke: #6e7681; }
      .grid { stroke: #30363d; }
      .dot { fill: #9198a1; }
      .dot-hosted { fill: #0d1117; stroke: #9198a1; }
      .dot-oap { fill: #4493f8; }
      .drain { fill: #3d1d0a; stroke: #f0883e; }
      .bad { fill: #f0883e; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow-accent" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="994" height="384" rx="12"/>
  <text class="h" x="14" y="32">Verified change flow</text><text class="warn" x="196" y="32">planned M3.3</text>
  <text class="s" x="14" y="52">Every change earns evidence before it reaches users. Long-lived environments are optional, not required.</text>
  <rect class="agent" x="14" y="80" width="170" height="104" rx="8"/>
  <text class="h" x="28" y="104">A change</text>
  <text class="b" x="28" y="124">new image for one</text>
  <text class="b" x="28" y="142">component, or a</text>
  <text class="b" x="28" y="160">spec edit</text>
  <path class="line" d="M184,132 L212,132" marker-end="url(#a)"/>
  <rect class="surface" x="216" y="72" width="260" height="190" rx="12"/>
  <text class="h" x="232" y="98">Preview</text><text class="mono" x="304" y="98">pr-42.shop.example.com</text>
  <text class="b" x="232" y="122">Production release + this change</text>
  <text class="b" x="232" y="140">Seeded data, test secrets</text>
  <text class="b" x="232" y="158">Expires automatically</text>
  <rect class="inst" x="232" y="172" width="228" height="74" rx="8"/>
  <text class="h" x="246" y="196">Declared checks</text>
  <text class="mono" x="246" y="216">GET /health → 200</text>
  <text class="mono" x="246" y="234">POST /api/cart → 201</text>
  <path class="line" d="M476,132 L504,132" marker-end="url(#a)"/>
  <text class="s" x="480" y="122">pass</text>
  <rect class="surface" x="508" y="72" width="300" height="190" rx="12"/>
  <text class="h" x="524" y="98">Guarded rollout in production</text>
  <rect class="planned" x="524" y="112" width="268" height="34" rx="7"/><text class="b" x="538" y="134">Router</text>
  <rect class="inst" x="524" y="172" width="84" height="48" rx="7"/><text class="h" x="534" y="192">api-1</text><text class="s" x="534" y="210">new</text>
  <path class="line" d="M566,146 L566,170" marker-end="url(#a)"/>
  <rect class="step" x="616" y="172" width="84" height="48" rx="7"/><text class="h" x="626" y="192">api-2</text><text class="s" x="626" y="210">old</text>
  <path class="line" d="M658,146 L658,170" marker-end="url(#a)"/>
  <rect class="step" x="708" y="172" width="84" height="48" rx="7"/><text class="h" x="718" y="192">api-3</text><text class="s" x="718" y="210">old</text>
  <path class="line" d="M750,146 L750,170" marker-end="url(#a)"/>
  <text class="s" x="524" y="246">One copy first, then the rest</text>
  <path class="line" d="M808,132 L836,132" marker-end="url(#a)"/>
  <rect class="inst" x="840" y="80" width="140" height="72" rx="8"/>
  <text class="h" x="854" y="104">Verified</text>
  <text class="s" x="854" y="124">evidence recorded</text>
  <text class="s" x="854" y="142">in the release</text>
  <rect class="drain" x="840" y="168" width="140" height="78" rx="8"/>
  <text class="h" x="854" y="192">Check fails</text>
  <text class="s" x="854" y="212">automatic rollback</text>
  <text class="s" x="854" y="230">to previous release</text>
  <path class="line" d="M808,200 L838,206" marker-end="url(#a)"/>
  <rect class="parked" x="14" y="290" width="480" height="74" rx="8"/>
  <text class="h" x="28" y="314">Optional: long-lived environments</text>
  <text class="s" x="28" y="334">Staging or demo environments for people who want them. Compare any two:</text>
  <text class="s" x="28" y="352">declared overrides · ahead · undeclared drift (values masked)</text>
  <rect class="parked" x="508" y="290" width="472" height="74" rx="8"/>
  <text class="h" x="522" y="314">Urgent fix fast lane</text>
  <text class="s" x="522" y="334">Skips the preview only with a recorded reason and exact owner approval.</text>
  <text class="s" x="522" y="352">Still uses guarded rollout and checks.</text>
</svg>
