<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 548" width="900" height="548" role="img" aria-labelledby="title desc">
  <title id="title">Where OAP fits</title>
  <desc id="desc">Two axes: what you deploy (individual resources to application as a unit) and who operates it (people and dashboards to agents and machine APIs). Coolify, Dokploy and Portainer sit near resources and dashboards; Compose, Dokku and Kamal in the middle; k3s and MicroK8s are API-driven but resource-oriented; hosted app platforms treat the application as a unit but are not self-hosted; Open App Platform targets the application unit operated by agents, self-hosted.</desc>
  <style>
    .bg { fill: #ffffff; }
    .surface { fill: #f6f8fa; stroke: #d0d7de; }
    .card { fill: #ffffff; stroke: #d0d7de; }
    .oap { fill: #ddf4ff; stroke: #0969da; }
    .agent { fill: #fbefff; stroke: #8250df; }
    .owner { fill: #fff8c5; stroke: #9a6700; }
    .app { fill: none; stroke: #0969da; stroke-width: 2; }
    .inst { fill: #dafbe1; stroke: #1a7f37; }
    .db { fill: #ffffff; stroke: #59636e; }
    .planned { fill: #fff8c5; stroke: #9a6700; stroke-dasharray: 6 4; }
    .line { stroke: #59636e; stroke-width: 1.6; fill: none; }
    .line-accent { stroke: #0969da; stroke-width: 1.8; fill: none; }
    .arrow { fill: #59636e; }
    .arrow-accent { fill: #0969da; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .h { font-size: 15px; font-weight: 600; }
    .b { font-size: 13px; }
    .s { font-size: 12px; fill: #59636e; }
    .label { font-size: 12px; font-weight: 600; fill: #0969da; }
    .warn { font-size: 12px; font-weight: 600; fill: #9a6700; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .surface { fill: #161b22; stroke: #30363d; }
      .card { fill: #0d1117; stroke: #30363d; }
      .oap { fill: #0c2d6b; stroke: #4493f8; }
      .agent { fill: #2d1f4d; stroke: #ab7df8; }
      .owner { fill: #3b2e0a; stroke: #d29922; }
      .app { stroke: #4493f8; }
      .inst { fill: #0f2d1a; stroke: #3fb950; }
      .db { fill: #0d1117; stroke: #9198a1; }
      .planned { fill: #3b2e0a; stroke: #d29922; }
      .line { stroke: #9198a1; }
      .line-accent { stroke: #4493f8; }
      .arrow { fill: #9198a1; }
      .arrow-accent { fill: #4493f8; }
      text { fill: #e6edf3; }
      .s { fill: #9198a1; }
      .label { fill: #4493f8; }
      .warn { fill: #d29922; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow-accent" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <style>
    .parked { fill: none; stroke: #8c959f; stroke-dasharray: 5 4; }
    .step { fill: #ffffff; stroke: #d0d7de; }
    .num { font-size: 12px; font-weight: 700; fill: #ffffff; }
    .numdot { fill: #0969da; }
    .axis { stroke: #8c959f; stroke-width: 1.2; }
    .grid { stroke: #d0d7de; stroke-width: 1; stroke-dasharray: 3 4; }
    .dot { fill: #59636e; }
    .dot-hosted { fill: #ffffff; stroke: #59636e; stroke-width: 2; }
    .dot-oap { fill: #0969da; }
    .drain { fill: #fff1e5; stroke: #bc4c00; stroke-dasharray: 5 3; }
    .bad { font-size: 12px; font-weight: 600; fill: #bc4c00; }
    @media (prefers-color-scheme: dark) {
      .parked { stroke: #6e7681; }
      .step { fill: #0d1117; stroke: #30363d; }
      .num { fill: #0d1117; }
      .numdot { fill: #4493f8; }
      .axis { stroke: #6e7681; }
      .grid { stroke: #30363d; }
      .dot { fill: #9198a1; }
      .dot-hosted { fill: #0d1117; stroke: #9198a1; }
      .dot-oap { fill: #4493f8; }
      .drain { fill: #3d1d0a; stroke: #f0883e; }
      .bad { fill: #f0883e; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow-accent" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="900" height="548" rx="12"/>
  <line class="grid" x1="505.0" y1="60" x2="505.0" y2="460"/>
  <line class="grid" x1="140" y1="260.0" x2="870" y2="260.0"/>
  <path class="axis" d="M140,460 L870,460" marker-end="url(#a)"/>
  <path class="axis" d="M140,460 L140,60" marker-end="url(#a)"/>
  <text class="b" x="140" y="488">Individual resources</text><text class="b" x="700" y="488">Application as a unit</text>
  <text class="s" x="445.0" y="488">what you deploy →</text>
  <text class="b" x="24" y="456">People and</text><text class="b" x="24" y="472">dashboards</text>
  <text class="b" x="24" y="70">Agents and</text><text class="b" x="24" y="86">machine APIs</text>
  <circle class="dot" cx="213" cy="404" r="7"/>
  <text class="b" x="225" y="409" text-anchor="start">Coolify, Dokploy</text>
  <text class="s" x="225" y="425" text-anchor="start">self-hosted PaaS dashboards</text>
  <circle class="dot" cx="184" cy="332" r="7"/>
  <text class="b" x="196" y="337" text-anchor="start">Portainer</text>
  <text class="s" x="196" y="353" text-anchor="start">container management UI</text>
  <circle class="dot" cx="388" cy="300" r="7"/>
  <text class="b" x="400" y="305" text-anchor="start">Docker Compose</text>
  <text class="s" x="400" y="321" text-anchor="start">one-shot CLI, no controller</text>
  <circle class="dot" cx="432" cy="372" r="7"/>
  <text class="b" x="444" y="377" text-anchor="start">Dokku</text>
  <text class="s" x="444" y="393" text-anchor="start">web/worker process types</text>
  <circle class="dot" cx="520" cy="252" r="7"/>
  <text class="b" x="532" y="257" text-anchor="start">Kamal</text>
  <text class="s" x="532" y="273" text-anchor="start">deploy tool, app + accessories</text>
  <circle class="dot" cx="286" cy="140" r="7"/>
  <text class="b" x="298" y="145" text-anchor="start">k3s / MicroK8s</text>
  <text class="s" x="298" y="161" text-anchor="start">full API, heavy, resource model</text>
  <circle class="dot-hosted" cx="724" cy="340" r="7"/>
  <text class="b" x="710" y="345" text-anchor="end">Hosted app platforms</text>
  <text class="s" x="710" y="361" text-anchor="end">managed PaaS, app-centric</text>
  <circle class="dot-oap" cx="753" cy="116" r="9"/>
  <text class="h" x="737" y="121" text-anchor="end">Open App Platform</text>
  <text class="s" x="737" y="137" text-anchor="end">self-hosted · agent-operated</text>
  <circle class="dot" cx="148" cy="520" r="6"/><text class="s" x="160" y="524">self-hosted</text>
  <circle class="dot-hosted" cx="260" cy="520" r="6"/><text class="s" x="272" y="524">hosted</text>
  <text class="s" x="350" y="524">Qualitative placement by the OAP author, not a benchmark.</text>
</svg>
