<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Open App Platform overview</title>
  <desc id="desc">An owner sets authority and an AI agent operates through the CLI, MCP or REST API. Open App Platform runs on the same server as the application and manages its components on Docker: web and API instances behind a router, a worker and a linked PostgreSQL database.</desc>
  <style>
    .bg { fill: #ffffff; }
    .surface { fill: #f6f8fa; stroke: #d0d7de; }
    .card { fill: #ffffff; stroke: #d0d7de; }
    .oap { fill: #ddf4ff; stroke: #0969da; }
    .agent { fill: #fbefff; stroke: #8250df; }
    .owner { fill: #fff8c5; stroke: #9a6700; }
    .app { fill: none; stroke: #0969da; stroke-width: 2; }
    .inst { fill: #dafbe1; stroke: #1a7f37; }
    .db { fill: #ffffff; stroke: #59636e; }
    .planned { fill: #fff8c5; stroke: #9a6700; stroke-dasharray: 6 4; }
    .line { stroke: #59636e; stroke-width: 1.6; fill: none; }
    .line-accent { stroke: #0969da; stroke-width: 1.8; fill: none; }
    .arrow { fill: #59636e; }
    .arrow-accent { fill: #0969da; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .h { font-size: 15px; font-weight: 600; }
    .b { font-size: 13px; }
    .s { font-size: 12px; fill: #59636e; }
    .label { font-size: 12px; font-weight: 600; fill: #0969da; }
    .warn { font-size: 12px; font-weight: 600; fill: #9a6700; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .surface { fill: #161b22; stroke: #30363d; }
      .card { fill: #0d1117; stroke: #30363d; }
      .oap { fill: #0c2d6b; stroke: #4493f8; }
      .agent { fill: #2d1f4d; stroke: #ab7df8; }
      .owner { fill: #3b2e0a; stroke: #d29922; }
      .app { stroke: #4493f8; }
      .inst { fill: #0f2d1a; stroke: #3fb950; }
      .db { fill: #0d1117; stroke: #9198a1; }
      .planned { fill: #3b2e0a; stroke: #d29922; }
      .line { stroke: #9198a1; }
      .line-accent { stroke: #4493f8; }
      .arrow { fill: #9198a1; }
      .arrow-accent { fill: #4493f8; }
      text { fill: #e6edf3; }
      .s { fill: #9198a1; }
      .label { fill: #4493f8; }
      .warn { fill: #d29922; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow-accent" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="560" rx="12"/>

  <!-- Server -->
  <rect class="surface" x="300" y="60" width="636" height="476" rx="14"/>
  <text class="h" x="320" y="88">Your server</text>
  <text class="s" x="412" y="88">one Docker host</text>

  <!-- People -->
  <rect class="owner" x="24" y="110" width="200" height="96" rx="10"/>
  <text class="h" x="40" y="138">Owner</text>
  <text class="b" x="40" y="160">Sets grants and policy</text>
  <text class="b" x="40" y="178">Approves risky plans</text>
  <text class="b" x="40" y="196">Pauses or revokes agents</text>

  <rect class="agent" x="24" y="250" width="200" height="112" rx="10"/>
  <text class="h" x="40" y="278">Your AI agent</text>
  <text class="b" x="40" y="300">Claude Code, Codex, scripts</text>
  <text class="b" x="40" y="318">Edits the app spec</text>
  <text class="b" x="40" y="336">Plans, applies, verifies</text>
  <text class="b" x="40" y="354">Diagnoses and fixes</text>

  <!-- Arrows from people to OAP -->
  <path class="line" d="M224,158 L316,158" marker-end="url(#a)"/>
  <text class="s" x="234" y="148">owner session</text>
  <path class="line-accent" d="M224,306 C270,306 270,262 316,262" marker-end="url(#aa)"/>
  <text class="label" x="234" y="332">CLI · MCP</text>
  <text class="label" x="234" y="348">REST</text>

  <!-- Users -->
  <text class="h" x="838" y="30">Users</text>
  <path class="line" d="M860,38 L860,124" marker-end="url(#a)"/>
  <text class="s" x="870" y="52">HTTPS</text>


  <!-- OAP -->
  <rect class="oap" x="320" y="110" width="210" height="196" rx="10"/>
  <text class="h" x="336" y="138">Open App Platform</text>
  <text class="s" x="336" y="158">Go service + PostgreSQL</text>
  <text class="b" x="336" y="188">App specs and versions</text>
  <text class="b" x="336" y="208">Plans and frozen releases</text>
  <text class="b" x="336" y="228">Grants, approvals, audit</text>
  <text class="b" x="336" y="248">Health and bounded logs</text>
  <text class="b" x="336" y="268">Incident evidence</text>
  <text class="b" x="336" y="288">Durable operations</text>

  <text class="s" x="320" y="336">Apps keep running if</text>
  <text class="s" x="320" y="352">OAP is down.</text>

  <!-- OAP to app -->
  <path class="line-accent" d="M530,208 L570,208" marker-end="url(#aa)"/>
  <text class="s" x="534" y="196">Docker</text>
  <text class="s" x="534" y="232">API</text>

  <!-- Application -->
  <rect class="app" x="576" y="110" width="344" height="406" rx="12"/>
  <text class="label" x="592" y="104">ONE APPLICATION · ONE SPEC</text>

  <rect class="planned" x="596" y="128" width="304" height="52" rx="8"/>
  <text class="h" x="612" y="151">Router · shop.example.com</text>
  <text class="warn" x="612" y="169">HTTPS, healthy copies only · planned M3.1</text>

  <!-- routes -->
  <path class="line" d="M680,180 L680,222" marker-end="url(#a)"/>
  <path class="line" d="M820,180 L820,222" marker-end="url(#a)"/>
  <text class="mono" x="690" y="206">/</text>
  <text class="mono" x="830" y="206">/api</text>

  <!-- web x3 -->
  <rect class="inst" x="614" y="238" width="132" height="44" rx="7"/>
  <rect class="inst" x="608" y="232" width="132" height="44" rx="7"/>
  <rect class="inst" x="602" y="226" width="132" height="44" rx="7"/>
  <text class="h" x="616" y="253">web</text>
  <text class="s" x="616" y="265">3 instances</text>

  <!-- api x2 -->
  <rect class="inst" x="764" y="232" width="132" height="44" rx="7"/>
  <rect class="inst" x="758" y="226" width="132" height="44" rx="7"/>
  <text class="h" x="772" y="253">api</text>
  <text class="s" x="772" y="265">2 instances</text>

  <!-- connections -->
  <path class="line" d="M824,276 L824,330" marker-end="url(#a)"/>
  <path class="line" d="M680,348 L680,404" marker-end="url(#a)"/>

  <!-- worker -->
  <rect class="inst" x="602" y="304" width="144" height="44" rx="7"/>
  <text class="h" x="616" y="324">worker</text>
  <text class="s" x="616" y="339">1 instance, no route</text>

  <!-- database -->
  <rect class="db" x="602" y="404" width="300" height="56" rx="7"/>
  <text class="h" x="616" y="427">PostgreSQL</text>
  <text class="s" x="616" y="446">linked, or owned single instance + volume</text>
  <path class="line" d="M824,346 L824,404" marker-end="url(#a)"/>
  <rect class="card" x="770" y="330" width="108" height="20" rx="4"/>
  <text class="s" x="780" y="344">app-local DNS</text>

  <text class="s" x="596" y="496">Deploy, scale, roll back and diagnose together.</text>
</svg>
