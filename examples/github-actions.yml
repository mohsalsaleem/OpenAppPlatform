# Copy into your application's repository after configuring registry access,
# OAP_URL, OAP_APPLICATION_ID variables, and OAP_API_TOKEN as a GitHub secret.
# The target operator must be able to pull the published image.
name: Release through OpenAppPlatform
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Select image
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
      - name: Submit immutable release
        env:
          OAP_URL: ${{ vars.OAP_URL }}
          OAP_APPLICATION_ID: ${{ vars.OAP_APPLICATION_ID }}
          OAP_API_TOKEN: ${{ secrets.OAP_API_TOKEN }}
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          DELIVERY_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          jq -n --arg image "$IMAGE" '{images:{web:$image}}' > release.json
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $OAP_API_TOKEN" \
            -H 'Content-Type: application/json' \
            -H "Idempotency-Key: github-$DELIVERY_ID" \
            --data-binary @release.json \
            "$OAP_URL/api/v1/applications/$OAP_APPLICATION_ID/deployments"
# HTTP 202 means queued, not deployed successfully. A production workflow should
# poll GET /api/v1/deployments/{returned-id} until a terminal state.
